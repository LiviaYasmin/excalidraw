name: "Bundle Size check @excalidraw/excalidraw"
on:
  pull_request:
    branches:
      - master
jobs:
  size:
    runs-on: ubuntu-latest
    env:
      CI_JOB_NUMBER: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
      - name: Install in packages/excalidraw
        run: yarn
        working-directory: packages/excalidraw
        env:
          CI: true
      - name: Measure pull request
        working-directory: packages/excalidraw
        run: |
          cp .size-limit.json "$RUNNER_TEMP/size-limit.json"
          cp ../../scripts/compare-bundle-size.js "$RUNNER_TEMP/compare-bundle-size.js"
          npm run build:esm
          npx --no-install size-limit --json > "$RUNNER_TEMP/size-current.json" || test "$?" -eq 1
      - name: Compare with base using the same measurement configuration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          git checkout --force "$BASE_SHA"
          cp "$RUNNER_TEMP/size-limit.json" packages/excalidraw/.size-limit.json
          cd packages/excalidraw
          npm run build:esm
          npx --no-install size-limit --json > "$RUNNER_TEMP/size-base.json" || test "$?" -eq 1
          node "$RUNNER_TEMP/compare-bundle-size.js" "$RUNNER_TEMP/size-base.json" "$RUNNER_TEMP/size-current.json"
